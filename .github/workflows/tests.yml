name: Tests

on:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'requirements*.txt', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # Pas de navigateur : les tests ne couvrent que le parsing et les calculs.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
