name: Daily price tracking

on:
  schedule:
    # Tous les jours à 9h UTC (10h Paris hiver / 11h Paris été)
    - cron: '0 9 * * *'
  workflow_dispatch:  # déclenchement manuel depuis l'onglet Actions
  push:
    # Republie le site quand le code de génération change (sans re-scraper).
    branches: [main]
    paths: ['hsn_tracker.py', 'myprotein_tracker.py', 'build.py', '.github/workflows/track-prices.yml']

permissions:
  contents: write  # commit de data/
  pages: write     # déploiement GitHub Pages
  id-token: write  # requis par actions/deploy-pages

# Force les actions JavaScript sur Node 24 (Node 20 sera retiré en sept 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium
        if: github.event_name != 'push'
        run: python -m playwright install --with-deps chromium

      - name: Run trackers (HSN + MyProtein en parallèle)
        id: track
        if: github.event_name != 'push'
        # Les deux scripts écrivent des fichiers disjoints (data/ et logs séparés)
        # → aucune contention. On n'arrête PAS le job si un site échoue : l'autre
        # doit quand même être committé et le site publié. Les codes de sortie
        # sont remontés à la dernière étape, qui fait échouer le run (→ email).
        #
        # Un tracker en échec est relancé une fois après 3 min (blocage Cloudflare
        # ponctuel, timeout réseau : HSN a renvoyé 1 le 2026-11-24 puis 47 produits
        # le lendemain). append_rows est idempotent sur la journée : une relance
        # ne duplique pas les lignes déjà écrites.
        #
        # La fin du log de chaque tentative ratée est publiée en annotation
        # (::warning / ::error). Les annotations se lisent SANS authentification
        # via l'API check-runs, contrairement aux logs : c'est ce que lit la skill
        # /fix-ci (.claude/skills/fix-ci) pour diagnostiquer un échec.
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set +e
          mkdir -p run-logs
          annotate() {  # $1 = error|warning, $2 = titre, $3 = fichier log
            msg=$(tail -n 40 "$3" | python -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'), end='')")
            echo "::$1 title=$2::$msg"
          }
          run_tracker() {  # $1 = nom, $2 = script
            for attempt in 1 2; do
              python "$2" 2>&1 | tee "run-logs/$1-$attempt.log"
              code=${PIPESTATUS[0]}
              [ "$code" -eq 0 ] && return 0
              if [ "$attempt" -eq 1 ]; then
                annotate warning "$1 : tentative 1 en échec (exit $code), relance dans 3 min" "run-logs/$1-1.log"
                sleep 180
              else
                annotate error "$1 : échec après 2 tentatives (exit $code)" "run-logs/$1-2.log"
              fi
            done
            return "$code"
          }
          run_tracker hsn hsn_tracker.py & PID_HSN=$!
          run_tracker myprotein myprotein_tracker.py & PID_MP=$!
          wait $PID_HSN; HSN=$?
          wait $PID_MP; MP=$?
          echo "HSN exit=$HSN / MyProtein exit=$MP"
          echo "hsn=$HSN" >> "$GITHUB_OUTPUT"
          echo "mp=$MP" >> "$GITHUB_OUTPUT"

      # Régénère tout docs/ (dashboards, recos, accueil, API) depuis data/, une
      # fois les deux relevés écrits.
      - name: Build site
        run: python build.py

      - name: Show errors log (if any)
        if: always()
        run: |
          for f in errors.log myprotein_errors.log; do
            if [ -s "$f" ]; then
              echo "=== $f ==="
              tail -n 100 "$f"
              # Aussi en annotation, lisible sans authentification (cf. plus haut).
              msg=$(tail -n 30 "$f" | python -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'), end='')")
              echo "::warning title=$f::$msg"
            fi
          done

      # Seules les données sont versionnées. Les pages sont reconstruites à chaque
      # run et publiées en artefact Pages (pas de HTML de 2 Mo committé par jour).
      - name: Commit and push prices
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily price update — $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Le déploiement Pages échoue parfois côté GitHub, sans rapport avec nos
      # données : « Deployment failed, try again later » (2026-11-25), « No
      # artifacts named github-pages were found » (2026-11-21). On retente une
      # fois après 1 min avant de déclarer l'échec.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deployment
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=Pages::1re tentative de déploiement en échec, relance dans 60 s"
          sleep 60

      - name: Deploy to GitHub Pages (2e tentative)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Health check
        if: always() && github.event_name != 'push'
        run: |
          HEALTH=0
          python build.py --health || HEALTH=$?
          if [ "${{ steps.track.outputs.hsn }}" != "0" ] || [ "${{ steps.track.outputs.mp }}" != "0" ]; then
            echo "::error::Un tracker a échoué (HSN=${{ steps.track.outputs.hsn }}, MyProtein=${{ steps.track.outputs.mp }})"
            exit 1
          fi
          if [ "$HEALTH" != "0" ]; then
            echo "::error::Relevé du jour anormal (cf. résumé du run)"
            exit 1
          fi
